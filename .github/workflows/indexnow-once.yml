name: IndexNow One-Time Canonical Push

on:
  push:
    branches: [main]
    paths:
      - "indexnow-trigger.txt"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Verify IndexNow key is live
        shell: bash
        env:
          INDEXNOW_KEY: 9f4a7c2e13b84d5aa6c1f790d2e65b31
        run: |
          set -euo pipefail
          key_url="https://rannta.com/${INDEXNOW_KEY}.txt"
          body="$(curl --retry 5 --retry-all-errors --silent --show-error --location --max-time 20 "${key_url}")"
          echo "Key URL: ${key_url}"
          if [[ "${body}" != *"${INDEXNOW_KEY}"* ]]; then
            echo "IndexNow key verification failed."
            exit 1
          fi
          echo "IndexNow key verified."

      - name: Submit canonical URLs
        shell: bash
        env:
          INDEXNOW_KEY: 9f4a7c2e13b84d5aa6c1f790d2e65b31
        run: |
          set -euo pipefail
          urls=(
            "https://rannta.com/"
            "https://rannta.com/ilia144000.html"
            "https://rannta.com/authoritative.html"
            "https://rannta.com/entity.html"
            "https://rannta.com/faq.html"
            "https://rannta.com/ai-index.html"
            "https://rannta.com/identity.json"
            "https://rannta.com/knowledge-graph.jsonld"
            "https://rannta.com/external-references.html"
            "https://rannta.com/llms.txt"
            "https://rannta.com/rannta-network.html"
            "https://rannta.com/whitepaper.html"
            "https://rannta.com/contracts.html"
            "https://rannta.com/burn.html"
            "https://rannta.com/kyc.html"
          )

          ok=0
          for url in "${urls[@]}"; do
            code="$(curl --retry 3 --retry-all-errors --silent --show-error               --output /tmp/indexnow.txt               --write-out '%{http_code}'               --get 'https://api.indexnow.org/indexnow'               --data-urlencode "url=${url}"               --data-urlencode "key=${INDEXNOW_KEY}")"
            echo "HTTP ${code}  ${url}"
            if [[ "${code}" == "200" || "${code}" == "202" ]]; then
              ok=$((ok+1))
            else
              cat /tmp/indexnow.txt || true
              exit 1
            fi
          done
          echo "Accepted submissions: ${ok}/${#urls[@]}"
