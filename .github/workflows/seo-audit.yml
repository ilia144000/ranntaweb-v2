name: SEO Canonical Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          target="https://rannta.com/ilia144000.html"
          for attempt in {1..24}; do
            body="$(curl --silent --show-error --location --max-time 15 "${target}" || true)"
            if [[ "${body}" == *"ilia144000"* ]]; then
              echo "Canonical founder page is live."
              exit 0
            fi
            echo "Waiting for live site (attempt ${attempt}/24)..."
            sleep 10
          done
          echo "Live site did not become ready in time."
          exit 1

      - name: Run public SEO audit
        run: python3 scripts/seo_audit.py
