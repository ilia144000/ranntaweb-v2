name: IndexNow Canonical URLs

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ilia144000.html"
      - "authoritative.html"
      - "entity.html"
      - "ai-index.html"
      - "ai.txt"
      - ".well-known/ai.txt"
      - "llms.txt"
      - "sitemap.xml"
      - "assets/js/site-shell.js"
      - "burn.html"
      - "manifesto.html"
      - "ranntaverse.html"
      - "symbolists.html"
      - "team.html"
      - "kyc.html"
      - "rannta-network.html"
      - "network/post-quantum.html"
      - "network/hybrid-security-evidence.html"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment
        shell: bash
        env:
          INDEXNOW_KEY: 9f4a7c2e13b84d5aa6c1f790d2e65b31
        run: |
          set -euo pipefail
          key_url="https://rannta.com/${INDEXNOW_KEY}.txt"

          for attempt in {1..24}; do
            body="$(curl --silent --show-error --location --max-time 15 "${key_url}" || true)"
            if [[ "${body}" == *"${INDEXNOW_KEY}"* ]]; then
              echo "IndexNow key is live."
              exit 0
            fi

            echo "Waiting for GitHub Pages deployment (attempt ${attempt}/24)..."
            sleep 10
          done

          echo "IndexNow key did not become reachable in time."
          exit 1

      - name: Submit canonical RANNTA URLs to IndexNow
        shell: bash
        env:
          INDEXNOW_KEY: 9f4a7c2e13b84d5aa6c1f790d2e65b31
        run: |
          set -euo pipefail
          urls=(
            "https://rannta.com/"
            "https://rannta.com/ilia144000.html"
            "https://rannta.com/authoritative.html"
            "https://rannta.com/entity.html"
            "https://rannta.com/ai-index.html"
            "https://rannta.com/ai.txt"
            "https://rannta.com/.well-known/ai.txt"
            "https://rannta.com/llms.txt"
            "https://rannta.com/rannta-network.html"
            "https://rannta.com/what-is-rannta.html"
            "https://rannta.com/network/hybrid-security-evidence.html"
            "https://rannta.com/network/post-quantum.html"
            "https://rannta.com/kyc.html"
            "https://rannta.com/team.html"
            "https://rannta.com/symbolists.html"
            "https://rannta.com/ranntaverse.html"
            "https://rannta.com/manifesto.html"
            "https://rannta.com/burn.html"
          )

          for url in "${urls[@]}"; do
            code="$(curl --retry 3 --retry-all-errors --silent --show-error \
              --output /tmp/indexnow-response.txt \
              --write-out '%{http_code}' \
              --get 'https://api.indexnow.org/indexnow' \
              --data-urlencode "url=${url}" \
              --data-urlencode "key=${INDEXNOW_KEY}")"

            echo "IndexNow HTTP ${code}: ${url}"
            if [[ "${code}" != "200" && "${code}" != "202" ]]; then
              cat /tmp/indexnow-response.txt || true
              exit 1
            fi
          done
