name: Staticize RANNTA Theme Once

on:
  push:
    paths:
      - '.github/workflows/staticize-rannta-theme-once.yml'

permissions:
  contents: write

jobs:
  staticize-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make 2026 theme first-paint static
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          style = root / 'style.css'
          legacy = root / 'assets/css/legacy-style-pre-2026.css'
          legacy.parent.mkdir(parents=True, exist_ok=True)

          if not legacy.exists():
              shutil.copyfile(style, legacy)

          style.write_text(
              "@import url('/assets/css/legacy-style-pre-2026.css?v=20260913');\n"
              "@import url('/assets/css/rannta-theme-2026.css?v=20260913-static3');\n"
              "@import url('/assets/css/rannta-theme-final-overrides.css?v=20260913-static3');\n",
              encoding='utf-8'
          )

          special = {
              'index.html': ['pq-home'],
              'swap.html': ['pq-simple','pq-page-swap'],
              'team.html': ['pq-simple','pq-page-team'],
              'ai-index.html': ['pq-simple','pq-page-ai'],
              'roadmap.html': ['pq-simple','pq-page-roadmap'],
              'nft.html': ['pq-simple','pq-page-nft'],
              'articles.html': ['pq-simple','pq-page-articles'],
              'contracts.html': ['pq-simple','pq-page-contracts'],
              'routex.html': ['pq-simple','pq-page-routex'],
              'rannta-network.html': ['pq-simple','pq-page-network'],
              'rannta-core.html': ['pq-simple','pq-page-core'],
          }

          def add_body_classes(text, wanted):
              m = re.search(r'<body([^>]*)>', text, flags=re.I)
              if not m:
                  return text
              attrs = m.group(1)
              cm = re.search(r'class\s*=\s*(["\'])(.*?)\1', attrs, flags=re.I|re.S)
              existing = cm.group(2).split() if cm else []
              merged = existing[:]
              for c in wanted:
                  if c not in merged:
                      merged.append(c)
              cls = ' '.join(merged)
              if cm:
                  new_attrs = attrs[:cm.start()] + f'class="{cls}"' + attrs[cm.end():]
              else:
                  new_attrs = attrs + f' class="{cls}"'
              return text[:m.start()] + '<body' + new_attrs + '>' + text[m.end():]

          changed = 0
          for p in root.rglob('*.html'):
              rel = p.as_posix()
              if rel == 'pq-style-preview.html' or '/node_modules/' in rel:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if '/style.css' not in text:
                  continue
              classes = special.get(p.name, ['pq-simple'])
              new = add_body_classes(text, classes)
              new = re.sub(
                  r'(<meta\s+name=["\']theme-color["\']\s+content=)["\'][^"\']*["\']',
                  r'\1"#f7faf9"',
                  new,
                  flags=re.I
              )
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed += 1

          print(f'STATIC_THEME_HTML_UPDATED={changed}')
          print('STYLE_ENTRYPOINT=STATIC')
          PY

      - name: Commit static first-paint theme
        shell: bash
        run: |
          git config user.name "RANNTA Theme Bot"
          git config user.email "network@rannta.com"
          git add style.css assets/css/legacy-style-pre-2026.css '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git commit -m "Make RANNTA 2026 theme static before first paint"
          git push
