name: Staticize RANNTA Theme Once

on:
  push:
    paths:
      - '.github/workflows/staticize-rannta-theme-once.yml'

permissions:
  contents: write

jobs:
  staticize-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Make 2026 theme static before first paint
        shell: bash
        run: |
          cd repo
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('.')
          style = root / 'style.css'
          legacy = root / 'assets/css/legacy-style-pre-2026.css'
          legacy.parent.mkdir(parents=True, exist_ok=True)
          if not legacy.exists():
              shutil.copyfile(style, legacy)
          style.write_text(
              "@import url('/assets/css/legacy-style-pre-2026.css?v=20260913');\n"
              "@import url('/assets/css/rannta-theme-2026.css?v=20260913-static4');\n"
              "@import url('/assets/css/rannta-theme-final-overrides.css?v=20260913-static4');\n",
              encoding='utf-8'
          )
          special = {
              'index.html':['pq-home'], 'swap.html':['pq-simple','pq-page-swap'],
              'team.html':['pq-simple','pq-page-team'], 'ai-index.html':['pq-simple','pq-page-ai'],
              'roadmap.html':['pq-simple','pq-page-roadmap'], 'nft.html':['pq-simple','pq-page-nft'],
              'articles.html':['pq-simple','pq-page-articles'], 'contracts.html':['pq-simple','pq-page-contracts'],
              'routex.html':['pq-simple','pq-page-routex'], 'rannta-network.html':['pq-simple','pq-page-network'],
              'rannta-core.html':['pq-simple','pq-page-core']
          }
          def add_classes(text,wanted):
              m=re.search(r'<body([^>]*)>',text,re.I)
              if not m:return text
              attrs=m.group(1)
              cm=re.search(r'class\s*=\s*(["\'])(.*?)\1',attrs,re.I|re.S)
              old=cm.group(2).split() if cm else []
              merged=old+[c for c in wanted if c not in old]
              if cm:newattrs=attrs[:cm.start()]+f'class="{" ".join(merged)}"'+attrs[cm.end():]
              else:newattrs=attrs+f' class="{" ".join(merged)}"'
              return text[:m.start()]+'<body'+newattrs+'>'+text[m.end():]
          changed=0
          for p in root.rglob('*.html'):
              rel=p.as_posix()
              if rel=='pq-style-preview.html' or '/node_modules/' in rel: continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              if '/style.css' not in text: continue
              new=add_classes(text,special.get(p.name,['pq-simple']))
              new=re.sub(r'(<meta\s+name=["\']theme-color["\']\s+content=)["\'][^"\']*["\']',r'\1"#f7faf9"',new,flags=re.I)
              if new!=text:
                  p.write_text(new,encoding='utf-8'); changed+=1
          print('STATIC_THEME_HTML_UPDATED='+str(changed))
          PY

      - name: Commit migration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          git config user.name "RANNTA Theme Bot"
          git config user.email "network@rannta.com"
          git add style.css assets/css/legacy-style-pre-2026.css
          git add -A '*.html' '**/*.html' || true
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m "Make RANNTA 2026 theme static before first paint"
          git push origin main
