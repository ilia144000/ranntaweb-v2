<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>RANNTA — Live PQ Cloud Style Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#10241f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .bar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;background:#10241f;color:#dbe8e4;border-bottom:1px solid #28453e;font-size:13px;position:relative;z-index:10}
    .bar strong{color:#fff}.bar a{color:#bfe7dd;text-decoration:none;font-weight:700}.bar .right{display:flex;gap:16px;align-items:center}.frame{display:block;width:100%;height:calc(100% - 48px);border:0;background:#f7faf9}
  </style>
</head>
<body>
  <div class="bar">
    <div><strong>RANNTA live reskin preview</strong> — exact rannta.com content, PQ Cloud visual language only</div>
    <div class="right"><span>noindex · experimental</span><a href="/" target="_top">Exit preview</a></div>
  </div>
  <iframe id="site" class="frame" src="/" title="RANNTA PQ Cloud style preview"></iframe>

  <script>
    (function(){
      const css = String.raw`
:root{
  color-scheme:light!important;
  --pq-ink:#111820;
  --pq-muted:#526067;
  --pq-line:#dce6e3;
  --pq-brand:#126355;
  --pq-brand-dark:#10241f;
  --pq-soft:#eef6f3;
  --pq-panel:#fff;
  --pq-bg:#f7faf9;
  --pq-blue:#edf3f8;
}
*{box-sizing:border-box!important}
html{scroll-behavior:smooth!important;background:var(--pq-bg)!important}
body{margin:0!important;background:var(--pq-bg)!important;color:var(--pq-ink)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;line-height:1.55!important}
body::before,body::after{display:none!important}
a{color:var(--pq-brand)!important}
h1,h2,h3,h4,h5,h6{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;color:var(--pq-ink)!important;text-shadow:none!important;letter-spacing:-.02em!important}
p,li,dd,dt,span{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
p{color:var(--pq-muted)!important}

/* shared header */
.siteHeader,[data-site-header] .siteHeader{position:sticky!important;top:0!important;z-index:100!important;display:grid!important;grid-template-columns:auto 1fr auto!important;align-items:center!important;gap:22px!important;min-height:72px!important;padding:12px clamp(18px,5vw,72px)!important;background:rgba(247,250,249,.97)!important;border:0!important;border-bottom:1px solid var(--pq-line)!important;box-shadow:none!important;backdrop-filter:blur(10px)!important}
.siteHeader__logoLink{display:flex!important;align-items:center!important;text-decoration:none!important}.siteHeader .logo{width:42px!important;height:42px!important;object-fit:contain!important;filter:none!important}
.siteHeader__brand{min-width:0!important}.site-brand-title{font-family:Inter,ui-sans-serif,system-ui!important;color:var(--pq-brand-dark)!important;font-size:15px!important;font-weight:850!important;line-height:1.2!important;text-transform:none!important;text-shadow:none!important}.site-brand-subtitle{color:var(--pq-muted)!important;font-size:11px!important;margin-top:3px!important}
.siteNav{justify-self:end!important}.siteNav__list{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:5px!important;flex-wrap:wrap!important;margin:0!important;padding:0!important;list-style:none!important}.siteNav a,.siteNav summary{display:inline-flex!important;align-items:center!important;min-height:38px!important;padding:8px 10px!important;border:0!important;border-radius:7px!important;background:transparent!important;color:var(--pq-brand)!important;font-family:Inter,ui-sans-serif,system-ui!important;font-size:12px!important;font-weight:700!important;text-decoration:none!important;box-shadow:none!important;text-shadow:none!important}.siteNav a:hover,.siteNav summary:hover{background:#e7f1ee!important}.siteNav__dropdown{background:#fff!important;border:1px solid var(--pq-line)!important;border-radius:10px!important;box-shadow:0 18px 40px rgba(16,36,31,.12)!important;padding:8px!important}.siteNav__dropdown a{display:flex!important}

/* pq mini nav under header */
body>nav[aria-label="RANNTA PQ Cloud security links"]{max-width:none!important;margin:0!important;padding:10px clamp(18px,7vw,96px)!important;background:#f1f7f5!important;border-bottom:1px solid var(--pq-line)!important;justify-content:flex-end!important}body>nav[aria-label="RANNTA PQ Cloud security links"] a{color:var(--pq-brand)!important;text-decoration:none!important}

/* home identity */
.home-identity{width:min(1180px,calc(100% - 36px))!important;margin:42px auto 18px!important;padding:0!important;display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr)!important;gap:22px!important;background:transparent!important;border:0!important;box-shadow:none!important}.home-identity__copy,.launch-news-card{background:#fff!important;border:1px solid var(--pq-line)!important;border-radius:12px!important;box-shadow:none!important;padding:clamp(22px,4vw,38px)!important}.home-identity h1{font-size:clamp(36px,5vw,64px)!important;line-height:1.02!important;margin:0 0 16px!important}.home-identity p{font-size:17px!important;max-width:760px!important}.home-identity__actions{display:flex!important;flex-wrap:wrap!important;gap:10px!important}.launch-news-card__label,.signal13-tag{color:var(--pq-brand)!important;background:#e4efec!important;border:0!important;border-radius:999px!important;text-shadow:none!important}.launch-news-card h2{font-size:26px!important}.launch-news-card time{color:var(--pq-muted)!important}.launch-news-card__links{display:flex!important;gap:14px!important;flex-wrap:wrap!important}.launch-news-card__links a{font-weight:700!important;text-decoration:none!important}

/* main hero with existing real content */
.signal-hero{width:100%!important;max-width:none!important;margin:0!important;padding:clamp(46px,7vw,88px) clamp(18px,7vw,96px)!important;display:grid!important;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)!important;align-items:center!important;gap:48px!important;background:linear-gradient(135deg,#eff7f3 0%,#fff 52%,#edf3f8 100%)!important;border:0!important;border-block:1px solid var(--pq-line)!important;box-shadow:none!important}.signal-hero .hero-copy{width:min(820px,100%)!important;margin:0 0 0 auto!important}.signal-hero h2{font-size:clamp(34px,4.5vw,62px)!important;line-height:1.04!important;margin:24px 0 16px!important}.signal-hero .sub{font-size:17px!important;color:#334047!important}.glyph-figure{width:min(430px,100%)!important;margin:0 auto!important;padding:20px!important;background:#fff!important;border:1px solid var(--pq-line)!important;border-radius:14px!important;box-shadow:0 18px 44px rgba(16,36,31,.08)!important}.glyph-figure img{width:100%!important;height:auto!important;filter:none!important}.glyph-figure figcaption{color:var(--pq-muted)!important;font-size:12px!important;text-align:center!important;margin-top:10px!important}

/* existing cards and action surfaces */
.swap-hero-card,.conversion-strip,.sealPro,.rannta-info-card,.pq-home-card,.routexHomeCard__inner,.nft-links,main>section,article:not(.launch-news-card){background:#fff!important;border:1px solid var(--pq-line)!important;box-shadow:none!important;color:var(--pq-ink)!important}
.swap-hero-card{display:block!important;padding:18px!important;border-radius:10px!important;text-decoration:none!important}.swap-hero-label{color:var(--pq-brand)!important;font-weight:850!important}.swap-hero-text{color:var(--pq-muted)!important}.swap-hero-cta{color:var(--pq-brand)!important;font-weight:800!important}
.conversion-strip{border-radius:10px!important;padding:18px!important;margin-top:18px!important}.conversion-strip__title,.contract-box__label{color:var(--pq-ink)!important}.conversion-strip__meta,.contract-box__value{color:var(--pq-muted)!important}.contract-box{background:#f8fbfa!important;border:1px solid var(--pq-line)!important;border-radius:8px!important}.conversion-strip__links a{color:var(--pq-brand)!important}

.btnHero,.btnConv,.ric-btn,.siteFooter__textLink,.button,.btnCopy{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:42px!important;padding:9px 15px!important;border:0!important;border-radius:7px!important;background:var(--pq-brand)!important;color:#fff!important;font-family:Inter,ui-sans-serif,system-ui!important;font-weight:750!important;text-decoration:none!important;text-shadow:none!important;box-shadow:none!important}.btnHero.ghost,.btnConv.ghost,.secondary,.btnCopy{background:#e4efec!important;color:#163e38!important;border:0!important}.btnHero:hover,.btnConv:hover,.ric-btn:hover{filter:brightness(.96)!important}

/* current homepage body sections */
main{background:var(--pq-bg)!important;color:var(--pq-ink)!important;padding:0!important}.sealPro,.rannta-info-card,main>.nft-links,main>section{width:min(1180px,calc(100% - 36px))!important;max-width:1180px!important;margin:22px auto!important;border-radius:12px!important;padding:clamp(20px,3vw,30px)!important}.sealPro__inner{background:transparent!important}.sealPro *{text-shadow:none!important}.sealPro__logo{filter:none!important}.sealPro__ring{display:none!important}
.rannta-info-card{text-align:left!important}.rannta-info-card h2{font-family:Inter,ui-sans-serif,system-ui!important;color:var(--pq-ink)!important;font-size:clamp(24px,3vw,34px)!important}.rannta-info-card p{color:var(--pq-muted)!important}

/* generic old dark/gold cleanup */
[style*="background:#"],[style*="background: #"]{box-shadow:none!important}hr{border:0!important;border-top:1px solid var(--pq-line)!important}.gold,.yellow,.accent{color:var(--pq-brand)!important}code{background:#e8efed!important;color:#163e38!important;border-radius:4px!important;padding:2px 5px!important}pre{background:#111820!important;color:#d8eef2!important;border-radius:8px!important}

/* footer */
.siteFooter,.ranntaFooterBar,[data-site-footer] .siteFooter{margin-top:48px!important;background:var(--pq-brand-dark)!important;color:#c8d8d5!important;border:0!important;box-shadow:none!important}.siteFooter a{color:#c8f2ea!important}.siteFooter__copy{color:#9fb7b2!important}.siteFooter__icon{fill:#c8f2ea!important}

@media(max-width:980px){.siteHeader,[data-site-header] .siteHeader{grid-template-columns:auto 1fr!important}.siteHeader__brand{display:none!important}.siteNav{grid-column:1/-1!important;justify-self:stretch!important}.siteNav__list{justify-content:flex-start!important}.home-identity,.signal-hero{grid-template-columns:1fr!important}.signal-hero .hero-copy{margin:0 auto!important}.glyph-figure{max-width:360px!important}}
@media(max-width:640px){.siteHeader,[data-site-header] .siteHeader{padding:10px 14px!important}.siteNav__list{gap:2px!important}.siteNav a,.siteNav summary{font-size:11px!important;padding:6px 7px!important}.home-identity{margin-top:20px!important}.home-identity h1{font-size:38px!important}.signal-hero{padding:38px 18px!important}.signal-hero h2{font-size:36px!important}}
      `;

      function skin(){
        const frame=document.getElementById('site');
        try{
          const doc=frame.contentDocument || frame.contentWindow.document;
          if(!doc || !doc.head) return;
          let old=doc.getElementById('pq-live-reskin');
          if(old) old.remove();
          const style=doc.createElement('style');
          style.id='pq-live-reskin';
          style.textContent=css;
          doc.head.appendChild(style);
        }catch(e){
          /* Cross-origin destinations are intentionally left untouched. */
        }
      }

      const frame=document.getElementById('site');
      frame.addEventListener('load',skin);
      setTimeout(skin,600);
    })();
  </script>
</body>
</html>
