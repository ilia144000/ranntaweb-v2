function classify(doc){
  const b=doc.body;if(!b)return;[...b.classList].filter(c=>c.startsWith('pq-')).forEach(c=>b.classList.remove(c));
  const p=(doc.location&&doc.location.pathname)||'/';
  if(p==='/'||p==='/index.html')b.classList.add('pq-home');else b.classList.add('pq-simple');
  if(p.endsWith('/swap.html')||p==='/swap.html')b.classList.add('pq-page-swap');
  if(p.endsWith('/team.html')||p==='/team.html')b.classList.add('pq-page-team');
  if(p.endsWith('/ai-index.html')||p==='/ai-index.html')b.classList.add('pq-page-ai');
  if(p.endsWith('/nft.html')||p==='/nft.html')b.classList.add('pq-page-nft');
  if(p.endsWith('/routex.html')||p==='/routex.html')b.classList.add('pq-page-routex');
}
function dark(rgb){const m=rgb&&rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);if(!m)return false;const a=m[4]===undefined?1:+m[4];if(a<.35)return false;const r=+m[1],g=+m[2],b=+m[3];return (.2126*r+.7152*g+.0722*b)<105}
function normalize(doc){
  const root=doc.body;if(!root)return;
  root.querySelectorAll('section,article,main,div').forEach(el=>{if(el.closest('header,.siteHeader,footer,.siteFooter,[data-site-footer]')||el.matches('pre,code'))return;const r=el.getBoundingClientRect();if(r.width<180||r.height<55)return;try{if(dark(doc.defaultView.getComputedStyle(el).backgroundColor))el.classList.add('pq-dark-surface')}catch(e){}});
  root.querySelectorAll('main a,main button').forEach(el=>{try{if(dark(doc.defaultView.getComputedStyle(el).backgroundColor))el.classList.add('pq-dark-action')}catch(e){}});
}
function skin(){
  const frame=document.getElementById('site');try{const doc=frame.contentDocument||frame.contentWindow.document;if(!doc||!doc.head||!doc.body)return;classify(doc);let old=doc.getElementById('pq-live-reskin');if(old)old.remove();const style=doc.createElement('style');style.id='pq-live-reskin';style.textContent=css;doc.head.appendChild(style);setTimeout(()=>normalize(doc),40);setTimeout(()=>normalize(doc),350)}catch(e){}
}
const frame=document.getElementById('site');frame.addEventListener('load',()=>{skin();setTimeout(skin,500);setTimeout(skin,1200)});setTimeout(skin,500);
})();
